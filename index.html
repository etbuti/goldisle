<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Goldisle Music Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #e0f0ff, #f8fbff);
            color: #1e2a4a;
            text-align: center;
            padding: 40px 10px;
        }
        h1 {
            color: #003366;
            margin-bottom: 10px;
            font-weight: 600;
        }
        #playlist {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        li {
            margin: 12px 0;
        }
        button {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        button:hover {
            background-color: #1e4e8c;
            transform: scale(1.05);
        }
        audio {
            margin-top: 20px;
            width: 80%;
            max-width: 500px;
        }
        footer {
            margin-top: 50px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>🎶 Goldisle Music</h1>
    <p>Independent Label · Evan Bei / billund</p>

    <audio id="player" controls>
        <source src="" type="audio/mpeg">
        Your browser does not support audio playback.
    </audio>

    <ul id="playlist"></ul>

    <footer>
        <p>© 2025 Goldisle Light Org (UK) · Private AI Music Browser</p>
        <p>📩 isletoken@proton.me</p>
    </footer>

    <script>
        // 自动扫描 media 文件夹
        async function loadPlaylist() {
            const playlist = document.getElementById("playlist");
            const player = document.getElementById("player");

            try {
                // 读取 GitHub Pages 的 media 文件夹索引
                const response = await fetch("media/");
                const text = await response.text();

                // 解析文件名
                const matches = Array.from(text.matchAll(/href="([^"]+\.(mp3|wav|ogg))"/g));
                const files = matches.map(m => m[1]);

                if (files.length === 0) {
                    playlist.innerHTML = "<li>No songs found in /media</li>";
                    return;
                }

                // 动态生成播放列表
                files.forEach(file => {
                    const li = document.createElement("li");
                    const btn = document.createElement("button");
                    btn.textContent = "▶️ " + decodeURIComponent(file);
                    btn.onclick = () => {
                        player.src = "media/" + file;
                        player.play();
                    };
                    li.appendChild(btn);
                    playlist.appendChild(li);
                });

                // 默认加载第一首
                player.src = "media/" + files[0];

            } catch (e) {
                playlist.innerHTML = "<li>⚠️ Unable to load playlist. GitHub Pages may block directory listing.</li>";
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
