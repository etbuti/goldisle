<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Goldisle Music</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3ff;
            color: #222;
            text-align: center;
            margin: 0;
            padding: 40px;
        }
        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
        }
        .player {
            margin: 30px auto;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
        }
        button {
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #0d6efd;
        }
        footer {
            margin-top: 40px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>🎵 Goldisle Music</h1>
    <p>Hosted by Goldisle Light Org (UK)</p>

    <div class="player">
        <audio id="audioPlayer" controls>
            <source src="media/song1.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <ul id="playlist">
        <li><button onclick="playSong('media/song1.mp3')">▶️ Song 1</button></li>
        <li><button onclick="playSong('media/song2.mp3')">▶️ Song 2</button></li>
    </ul>

    <footer>
        <p>© 2025 Goldisle Light Org (UK) | Private AI Browser | Contact: isletoken@proton.me</p>
    </footer>

    <script>
        const player = document.getElementById("audioPlayer");
        function playSong(src) {
            player.src = src;
            player.play();
        }
    </script>
</body>
</html>
